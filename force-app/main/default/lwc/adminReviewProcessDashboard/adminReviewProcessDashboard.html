<template>
    <div class="slds-p-around_small">
        <div class="slds-grid slds-wrap slds-gutters">
            <!-- Total Reviews -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <div class="slds-card slds-p-around_medium slds-text-align_center">
                    <header class="slds-text-title_caps slds-m-bottom_x-small">Total Reviews</header>
                    <div class="slds-text-heading_large">{totalReviews}</div>
                </div>
            </div>

            <!-- Total Feedback -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <div class="slds-card slds-p-around_medium slds-text-align_center">
                    <header class="slds-text-title_caps slds-m-bottom_x-small">Total Feedback</header>
                    <div class="slds-text-heading_large">{totalFeedback}</div>
                </div>
            </div>

            <!-- Total Records -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <div class="slds-card slds-p-around_medium slds-text-align_center">
                    <header class="slds-text-title_caps slds-m-bottom_x-small">Total Records</header>
                    <div class="slds-text-heading_large">{totalRecords}</div>
                </div>
            </div>
        </div>

        <div class="dashboard-container slds-p-around_medium slds-m-top_small">
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-5">
                    <lightning-combobox
                        name="baseObjectApiName"
                        label="Base Object (Polymorphic Context)"
                        value={chartRequest.baseObjectApiName}
                        options={baseObjectOptions}
                        onchange={handleChartParamsChange}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-5">
                    <lightning-combobox
                        name="sourceObjectApiName"
                        label="Source Data Object"
                        value={chartRequest.sourceObjectApiName}
                        options={objectOptions}
                        onchange={handleChartParamsChange}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-5">
                    <lightning-combobox
                        name="groupByFieldApiName"
                        label="Group By Field"
                        value={chartRequest.groupByFieldApiName}
                        options={fieldOptions}
                        onchange={handleChartParamsChange}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-5">
                    <lightning-combobox
                        name="chartType"
                        label="Chart Type"
                        value={chartRequest.chartType}
                        options={chartTypeOptions}
                        onchange={handleChartParamsChange}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-5 slds-p-top_large">
                    <lightning-button variant="brand" label="Add Chart" onclick={handleAddCustomChart}></lightning-button>
                </div>
            </div>
            <div class="slds-grid">
                <div class="slds-col slds-size_1-of-1">
                    <div>
                        <template for:each={allGraphs} for:item="graph" for:index="index">
                            <div lwc:if={graph.visible} key={graph.id} class="graph-container slds-box slds-theme_shade slds-m-bottom_medium">
                                <canvas data-id={graph.id} class="chart-canvas" lwc:dom="manual"></canvas>
                            </div>
                        </template>
                    </div>

                    <div class="slds-grid slds-grid_align-center carousel-nav">
                        <template for:each={allGraphs} for:item="graph" for:index="index">
                            <div key={graph.id} class="dot-wrapper">
                                <input
                                    title={graph.title}
                                    type="radio"
                                    name="graph-nav"
                                    id={graph.id}
                                    value={index}
                                    checked={graph.visible}
                                    onchange={handleDotChange}
                                    class="carousel-dot"/>
                                <label for={graph.id}></label>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</template>
